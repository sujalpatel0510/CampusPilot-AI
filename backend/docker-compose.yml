services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campuspilot
      POSTGRES_PASSWORD: campuspilot
      POSTGRES_DB: campuspilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuspilot -d campuspilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://campuspilot:campuspilot@db:5432/campuspilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-to-a-long-random-string
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      AI_PROVIDER: mock
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
