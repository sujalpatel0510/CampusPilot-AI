services:
  - type: web
    name: campuspilot-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campuspilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: "http://localhost:3000"

databases:
  - name: campuspilot-db
    databaseName: campuspilot
    user: campuspilot
    plan: free
